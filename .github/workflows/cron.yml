name: Ping API Endpoint

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send GET Request (timed, timeout)
        run: |
          curl --fail -s --max-time 10 -o /dev/null -w "status=%{http_code} time_total=%{time_total}\n" https://edubuddy-api-0wsz.onrender.com/cron-job
